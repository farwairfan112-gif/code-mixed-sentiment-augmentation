# config.yaml — LLM-CMSA Project Configuration
# Paper: "Cross-Lingual Synthetic Augmentation and Language-Aware Training
#         for Code-Mixed Sentiment Analysis" (Farwa Irfan et al., 2025)

models:
  mBERT: "bert-base-multilingual-cased"
  XLM-T: "cardiffnlp/twitter-xlm-roberta-base"

training:
  num_labels:    3          # Positive / Negative / Neutral
  max_seq_len:   64         # Extension experiments (reproduction used 40)
  batch_size:    32
  learning_rate: 5.0e-5
  weight_decay:  0.01
  epsilon:       1.0e-8
  num_epochs:    3
  seed:          42

gradual_finetuning:
  stage_lrs:   [1.0e-6, 2.0e-6, 2.0e-6, 4.0e-6, 2.0e-6]
  syn_sizes:   [50000,  25000,  15000,   5000,   0]

data:
  repo_url: "https://github.com/lindazeng979/LLM-CMSA.git"
  repo_dir: "LLM-CMSA"

  spanish_english:
    train_natural:    "LLM-CMSA/Spanish-English/ensp_natural_train.csv"
    dev_natural:      "LLM-CMSA/Spanish-English/ensp_natural_dev.csv"
    test_natural:     "LLM-CMSA/Spanish-English/ensp_natural_dev.csv"   # proxy
    synthetic_llm:    "LLM-CMSA/Spanish-English/ensp_synthetic_llm-generated.csv"
    synthetic_random: "LLM-CMSA/Spanish-English/ensp_synthetic_randomly-translated.csv"

  malayalam_english:
    train_natural:    "LLM-CMSA/Malayalam-English/enma_natural_train.csv"
    dev_natural:      "LLM-CMSA/Malayalam-English/enma_natural_dev.csv"
    test_natural:     "LLM-CMSA/Malayalam-English/enma_natural_test.csv"
    synthetic_llm:    "LLM-CMSA/Malayalam-English/enma_synthetic_llm-generated.csv"

  hinglish:
    train: "data/sentimix_train.csv"
    dev:   "data/sentimix_dev.csv"
    test:  "data/sentimix_test.csv"
    # Download: https://github.com/dipteshkanojia/challengeSentimix

labels:
  Positive: 0
  Negative: 1
  Neutral:  2

output:
  checkpoints: "checkpoints/"
  results:     "results/"
  plots:       "results/plots/"

# Professor-approved single experiment
primary_experiment:
  name:       "sp_xlmt_natural"
  model:      "XLM-T"
  dataset:    "spanish_english"
  setup:      "natural_only"
  paper_f1:   0.588
  checkpoint: "checkpoints/sp_xlmt_natural/"
